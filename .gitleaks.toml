# Gitleaks configuration for the DevSecOps TP
# https://github.com/gitleaks/gitleaks#configuration

title = "Gitleaks configuration for democyber"

# Use the default Gitleaks rules (GitHub tokens, AWS keys, passwords, etc.)
[extend]
useDefault = true

# Global allowlist: do not scan generated / third-party files
[allowlist]
description = "Global allowlist for generated and third-party files"
paths = [
    '''\.git/''',
    '''target/''',
    '''node_modules/''',
    '''dist/''',
]
