name: CI/CD - democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # ============================================================
      # PARTIE I - Détection de secrets avec Gitleaks
      # ============================================================

      # 1 - Checkout the code (fetch-depth: 0 = historique complet)
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2 - Gitleaks scan (avant la compilation)
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

      # 3 - Upload the Gitleaks report (même si le scan échoue)
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: warn

      # ============================================================
      # Compilation Java
      # ============================================================

      # 4 - Install Java
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # 5 - Build Java project with Maven
      - name: Build Java project with Maven
        run: mvn clean package

      # ============================================================
      # PARTIE II - Docker : build, test et scan Trivy
      # ============================================================

      # 6 - Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7 - Build Docker image (deux tags : local + Docker Hub)
      - name: Build Docker image
        run: docker build -t democyber:latest -t $DOCKER_IMAGE_NAME .

      # 8 - Test Docker image locally
      - name: Test Docker image locally
        run: |
          cleanup() { docker rm -f democyber-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name democyber-test -p 8080:8080 democyber:latest

          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/health >/dev/null; then
              echo "L'application répond (tentative $i)."
              break
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://localhost:8080/health
          echo "Test Docker OK : l'application répond sur le port 8080."

      # 9 - Trivy : rapport SARIF (format modifié) pour l'artifact
      - name: Scan Docker image with Trivy (SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'democyber:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # 10 - Upload the Trivy report (même si le scan échoue)
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: warn

      # 11 - Trivy : barrière de sécurité (le pipeline échoue si CRITICAL/HIGH)
      - name: Trivy security gate (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'democyber:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # ============================================================
      # PARTIE III - Publication de l'image sur Docker Hub
      # ============================================================

      # 12 - Push Docker image (uniquement si le scan Trivy est passé)
      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_NAME
      # ============================================================
      # Analyse statique avec SonarCloud
      # ============================================================
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
